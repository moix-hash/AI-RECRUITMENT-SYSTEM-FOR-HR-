# Copy these values into Streamlit Community Cloud > Advanced settings > Secrets.
# Do not commit a real secrets.toml file.
APP_ENV = "production"
DATABASE_URL = "postgresql+psycopg://DATABASE_USER:DATABASE_PASSWORD@DATABASE_HOST:5432/DATABASE_NAME?sslmode=require"
SECRET_KEY = "replace-with-a-long-random-secret"
JWT_SECRET = "replace-with-a-different-long-random-secret"
MODEL_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-2.0-flash"
GEMINI_API_KEY = "paste-a-rotated-gemini-key-here"
MAX_UPLOAD_SIZE_MB = "20"
SESSION_TIMEOUT_MINUTES = "60"
